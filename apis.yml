name: Assemble
description: >-
  Assemble builds autonomous AI agents that help enterprise IT and business-systems
  teams automate development work inside core platforms such as Salesforce, SAP,
  Workday, and NetSuite. The agents scope changes across integrated ERP, CRM, and
  HRIS systems, understand cross-system dependencies, implement and validate
  modifications, and keep a complete audit trail so teams can review agent work,
  approve modifications, and revert individual changes or restore a system to a
  prior state. Assemble is a Y Combinator (Summer 2026) company targeting IT and
  business-systems teams managing complex enterprise transformations. This profile
  was added to the API Evangelist network as a portfolio-lead stub; as of this
  enrichment pass the company publishes no public developer API, documentation, or
  OpenAPI, so only its verified public identity and website properties are captured.
